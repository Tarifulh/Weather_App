<!DOCTYPE html>

<html>

<body>

    <h1>Weather App</h1>

    <input id="cityInput" placeholder="Enter city name">

    <button id="searchButton">Search</button>

<div>
    <h2>Weather</h2>

    <p>Temperature: <span id="temperature">--</span> °C</p>
    <p>Humidity: <span id="humidity">--</span> %</p>
    <p>Wind Speed: <span id="wind">--</span> km/h</p>
    <p>Feels like: <span id="feels">--</span> °C</p>
    <p>Visibility: <span id="visibility">--</span> m</p>
    <p>Precipitation: <span id="precipitations">--</span> mm</p>
    <p>Snowfall: <span id="snowfalls">--</span> mm</p>
    <p>Condition: <span id="conditions">--</span></p>
</div>



    <script src="script.js"></script>


</body>

</html>
